# Local development stack:  docker compose up --build
# App: http://localhost:8085  Jenkins: http://localhost:8082  SonarQube: http://localhost:9000
services:

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongo:27017/mern_cicd
      APP_VERSION: local
    ports: ["5006:5000"]
    depends_on:
      mongo: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["8085:80"]
    volumes:
      # proxy /api to the backend container (on AWS the ALB does this instead)
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]

  jenkins:
    build: ./jenkins
    user: root
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: "-Xmx1g"
    restart: unless-stopped

  sonarqube:
    image: sonarqube:24.12.0.100206-community
    depends_on: [sonar-db]
    ports: ["9000:9000"]
    # Let SonarQube call Jenkins' private Compose address for quality-gate webhooks.
    # Disable the Elasticsearch bootstrap check for Docker Desktop.
    command:
      - "-Dsonar.validateWebhooks=false"
      - "-Dsonar.es.bootstrap.checks.disable=true"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    restart: unless-stopped

  sonar-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  mongo-data:
  jenkins-home:
  sonar-data:
  sonar-extensions:
  sonar-logs:
  sonar-db-data:
